<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria - Enterprise Natural Language Query Assistant</title>
  <meta name="description" content="AI Agent that allows business users to query enterprise data across projects, contracts, sales, finance, procurement, and construction.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Layer -->
    <header class="app-header">
      <div class="header-left">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation history">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <div class="brand-wrapper">
          <div class="brand-icon" aria-hidden="true">A</div>
          <div class="brand-title">
            <span>Aria</span>
            <span class="brand-badge">NL Query Engine</span>
          </div>
        </div>
      </div>

      <div class="header-right">
        <!-- Static User Badge -->
        <div class="user-badge" title="Authenticated session context (RBAC: Sales Manager)">
          <div class="user-badge-dot" aria-hidden="true"></div>
          <span>Signed in as: <strong>Sales Manager</strong></span>
        </div>

        <!-- Observability Link -->
        <a href="admin.html" class="header-action-btn" title="View agent execution traces and observability dashboard">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          <span>Observability</span>
        </a>

        <!-- Light / Dark Theme Toggle -->
        <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle color theme">
          <!-- Populated by JavaScript -->
        </button>
      </div>
    </header>

    <!-- Main Workspace Area -->
    <div class="main-wrapper">
      <!-- Conversation History Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button type="button" class="btn-new-query" id="newQueryBtn">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>New Query</span>
          </button>
        </div>

        <div class="sidebar-content">
          <div class="sidebar-section-title">Session Query History</div>
          <ul class="history-list" id="historyList">
            <!-- Dynamically populated -->
          </ul>
        </div>

        <div class="sidebar-footer">
          <div style="font-weight: 500; margin-bottom: 2px;">Data Environment</div>
          <div style="font-size: 10px; color: var(--text-muted);">Cloud Kinetics DW (104 Tables)</div>
        </div>
      </aside>

      <!-- Main Query / Chat Viewport -->
      <main class="chat-viewport">
        <!-- Scrollable Messages Container -->
        <div class="chat-messages" id="chatMessages">
          <div class="chat-inner-container" id="chatContainer">
            <!-- Populated by app.js: idle hero or active conversation thread -->
          </div>
        </div>

        <!-- Bottom Input Bar -->
        <footer class="chat-input-bar">
          <div class="input-box-wrapper">
            <input 
              type="text" 
              class="chat-input-field" 
              id="chatInput" 
              placeholder="Ask a business question in plain English (e.g. Which projects have highest receivables?)..."
              aria-label="Natural-language business question input"
              autocomplete="off"
            />
            <button type="button" class="btn-send" id="sendBtn" disabled aria-label="Send question">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
          <div class="input-disclaimer">
            Aria synthesizes answers exclusively from validated enterprise database tables. Read-only permissions enforced.
          </div>
        </footer>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
